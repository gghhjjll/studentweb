services:
  - type: web
    name: attendance-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: root
      - key: ADMIN_PASS
        sync: false
      - key: COOKIE_SECURE
        value: "1"
